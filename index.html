<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38bdf8">
<meta name="robots" content="noindex,nofollow">
<title>秒看视频 · 发布页</title>
<style>
:root{
  --sky-50:#f2faff; --sky-100:#e3f4ff; --sky-200:#c5e8fd; --sky-300:#8ed4fa;
  --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7; --sky-700:#075985;
  --ink:#0b3a53; --ink-2:#4a7c96; --line:rgba(14,165,233,.16);
  --shadow:0 18px 40px -18px rgba(2,132,199,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 50% -12%,#bfe9ff 0%,rgba(191,233,255,0) 62%),
    radial-gradient(700px 420px at 88% 8%,#d8f1ff 0%,rgba(216,241,255,0) 55%),
    linear-gradient(180deg,#f0f9ff 0%,#f8fdff 46%,#ffffff 100%);
  min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:40px 20px calc(40px + env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:430px;position:relative;z-index:1;animation:in .7s cubic-bezier(.22,1,.36,1) both;}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 头部 */
header{text-align:center;margin-bottom:30px;}
.logo{
  display:inline-flex;align-items:center;gap:9px;
  font-size:30px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(120deg,#0ea5e9,#38bdf8 55%,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(140deg,#38bdf8,#0ea5e9);
  box-shadow:0 0 0 5px rgba(56,189,248,.16);flex:none;}
.sub{margin-top:10px;font-size:13px;color:var(--ink-2);letter-spacing:.3px;}
.sub kbd{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--sky-700);
  background:#fff;border:1px solid var(--line);border-bottom-width:2px;
  padding:2px 7px;border-radius:6px;margin:0 2px;
}

/* 地址卡 */
.card{
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:22px;
  padding:26px 22px 22px;box-shadow:var(--shadow);
  text-align:center;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,#7dd3fc,#38bdf8,#0ea5e9,#38bdf8,#7dd3fc);
}
.label{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--sky-600);
  text-transform:uppercase;margin-bottom:14px;}
.addr{
  display:block;font-size:27px;font-weight:800;letter-spacing:-.6px;
  color:var(--sky-700);text-decoration:none;line-height:1.25;word-break:break-all;
  transition:.25s;
}
.addr:hover{color:var(--sky-500);}
.addr small{font-size:14px;font-weight:600;color:var(--sky-400);}

.btns{display:flex;gap:10px;margin-top:22px;}
.btn{
  flex:1;height:50px;border-radius:14px;border:0;cursor:pointer;
  font-size:15px;font-weight:700;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;transition:transform .16s,box-shadow .25s,background .25s;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,#38bdf8,#0284c7);
  box-shadow:0 12px 24px -10px rgba(2,132,199,.75);
}
.btn-primary:hover{box-shadow:0 16px 30px -10px rgba(2,132,199,.85);}
.btn-ghost{color:var(--sky-700);background:#fff;border:1.5px solid var(--sky-200);}
.btn-ghost:hover{background:var(--sky-50);border-color:var(--sky-300);}

/* 下载 */
.dl{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:14px;padding:18px 22px;border-radius:18px;text-decoration:none;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  box-shadow:0 10px 26px -18px rgba(2,132,199,.6);transition:.22s;
}
.dl:hover{border-color:var(--sky-300);transform:translateY(-1px);}
.dl-l{display:flex;flex-direction:column;gap:3px;}
.dl-t{font-size:15px;font-weight:700;color:var(--sky-700);}
.dl-s{font-size:12px;color:var(--ink-2);}
.dl-arrow{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e0f3ff,#c9ebff);color:var(--sky-600);
}
.dl-arrow svg{width:18px;height:18px;}

footer{margin-top:26px;text-align:center;font-size:11.5px;color:#8fb4c7;line-height:1.9;}

/* 复制成功提示 */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:rgba(7,89,133,.94);color:#fff;font-size:13px;font-weight:600;
  padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.3s;backdrop-filter:blur(6px);z-index:9;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

@media(max-width:380px){
  .addr{font-size:23px;}
  .logo{font-size:26px;}
  .btns{flex-direction:column;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><span class="dot"></span>秒看视频</div>
    <p class="sub">永久发布页 · 按 <kbd>Ctrl</kbd>+<kbd>D</kbd> 收藏</p>
  </header>

  <main class="card">
    <div class="label">当前发布地址</div>
    <a class="addr" href="https://mksp1080.top">mksp1080.top<small>/</small></a>
    <div class="btns">
      <a class="btn btn-primary" href="https://mksp1080.top">打开网站</a>
      <button class="btn btn-ghost" id="copyBtn" type="button">复制地址</button>
    </div>
  </main>

  <a class="dl" href="https://mksp1080.top/mksp_2.1.2.apk">
    <span class="dl-l">
      <span class="dl-t">下载最新版</span>
      <span class="dl-s">v2.1.2 · 68.4 MB</span>
    </span>
    <span class="dl-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 12 5 5 5-5"/><path d="M4 20h16"/></svg>
    </span>
  </a>

  <footer>唯一发布页 · 请勿相信其他来源的安装包<br>最后更新 2026-11-18</footer>

</div>

<div class="toast" id="toast">地址已复制</div>

<script>
(function () {
  var addr = 'https://mksp1080.top/';
  var toast = document.getElementById('toast');
  var t = null;
  function show() {
    toast.classList.add('on');
    clearTimeout(t);
    t = setTimeout(function () { toast.classList.remove('on'); }, 1600);
  }
  document.getElementById('copyBtn').addEventListener('click', function () {
    var done = function () { show(); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = addr;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });
})();
</script>
</body>
</html>
