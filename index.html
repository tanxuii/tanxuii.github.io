<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a75ff">
<meta name="robots" content="noindex,nofollow">
<title>秒看视频 · 永久发布页</title>
<style>
:root{
  --p:#5a75ff;
  --p-dark:#3a4fd6;
  --p-light:#8fa0ff;
  --tint:rgba(90,117,255,.10);
  --tint-2:rgba(90,117,255,.18);
  --ink:#16204d;
  --ink-2:#5a6688;
  --ink-3:#8b95b4;
  --line:rgba(90,117,255,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#eef1ff 0%,#f6f8ff 42%,#ffffff 100%);
  display:flex;align-items:center;justify-content:center;
  padding:34px 20px 40px;position:relative;overflow-x:hidden;
}

/* 背景光晕 */
.glow{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.g1{width:320px;height:320px;top:-120px;right:-90px;background:rgba(90,117,255,.28)}
.g2{width:280px;height:280px;bottom:-130px;left:-100px;background:rgba(143,160,255,.26)}
.g3{width:200px;height:200px;top:38%;left:-120px;background:rgba(90,117,255,.12)}

.wrap{width:100%;max-width:400px;position:relative;z-index:1;animation:rise .7s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 头部 */
.head{text-align:center;margin-bottom:26px}
.mark{
  width:60px;height:60px;border-radius:18px;margin:0 auto 16px;
  background:linear-gradient(145deg,#7d90ff 0%,var(--p) 48%,var(--p-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px -10px rgba(90,117,255,.75),inset 0 1px 0 rgba(255,255,255,.5);
  animation:float 5s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-4px)}}
.mark svg{width:26px;height:26px;fill:#fff;margin-left:2px}
.brand{font-size:27px;font-weight:800;letter-spacing:.5px;line-height:1.15;
  background:linear-gradient(120deg,#4d63f0 0%,#5a75ff 45%,#8fa0ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;margin-top:9px;padding:4px 11px;border-radius:99px;
  font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#fff;
  background:linear-gradient(135deg,#6b83ff,#4a63f0);
  box-shadow:0 6px 14px -6px rgba(90,117,255,.85)}
.sub{margin-top:13px;font-size:12.5px;color:var(--ink-3);letter-spacing:.2px}
.sub kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;color:var(--p-dark);font-weight:600}

/* 卡片 */
.card{
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.95);
  border-radius:26px;padding:22px 20px 20px;position:relative;overflow:hidden;
  box-shadow:0 26px 50px -26px rgba(58,79,214,.42),0 2px 6px -2px rgba(22,32,77,.06);
}
.card::before{content:'';position:absolute;top:0;left:14%;right:14%;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(90,117,255,.9),transparent)}

.row{margin-bottom:15px}
.row:last-of-type{margin-bottom:20px}
.row-label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:var(--ink-3);letter-spacing:.6px;margin-bottom:8px}
.row-label .badge{font-size:10px;font-weight:700;color:var(--p);background:var(--tint);
  border-radius:99px;padding:2px 7px;letter-spacing:.2px}
.addr{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(90,117,255,.09),rgba(90,117,255,.05));
  border:1px dashed var(--line);border-radius:15px;padding:11px 12px 11px 14px;
}
.addr-val{
  flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15.5px;font-weight:700;color:var(--p-dark);letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all;
}
.copy{
  flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
  border:1px solid rgba(90,117,255,.3);background:#fff;color:var(--p);
  font-family:inherit;font-size:12px;font-weight:700;border-radius:10px;
  padding:7px 10px;cursor:pointer;transition:.18s;
}
.copy svg{width:13px;height:13px}
.copy:active{transform:scale(.95);background:var(--tint)}

.go{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:16px;border:0;border-radius:17px;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,#7d90ff 0%,#5a75ff 46%,#4159e8 100%);
  box-shadow:0 16px 30px -12px rgba(90,117,255,.95),inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;overflow:hidden;transition:transform .16s,box-shadow .2s;
  text-decoration:none;
}
.go::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%);
  transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,62%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
.go:active{transform:translateY(1px) scale(.995);box-shadow:0 8px 18px -10px rgba(90,117,255,.9)}
.go svg{width:17px;height:17px;stroke:#fff;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.92}

.status{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12px;font-weight:600;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.16);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,.05)}}
.dot.warn{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16);animation:none}

footer{margin-top:24px;text-align:center;font-size:11.5px;line-height:1.95;color:var(--ink-3)}
footer b{color:var(--ink-2);font-weight:700}

/* 复制提示 */
.toast{
  position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);z-index:50;
  background:#1d2a5e;color:#fff;font-size:13px;font-weight:600;
  padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.22,1,.36,1);box-shadow:0 14px 30px -12px rgba(22,32,77,.6);
  display:flex;align-items:center;gap:8px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:14px;height:14px;stroke:#4ade80;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

@media(max-width:360px){
  .brand{font-size:24px}
  .addr-val{font-size:14px}
  .card{padding:19px 16px 17px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<div class="wrap">
  <div class="head">
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5z"/></svg>
    </div>
    <div class="brand">秒看视频</div>
    <div class="tag">永久发布页</div>
    <div class="sub">请认准本页地址 · 按 <kbd>Ctrl</kbd> + <kbd>D</kbd> 收藏防失联</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="row-label">发布页地址<span class="badge">本页 · 建议收藏</span></div>
      <div class="addr">
        <span class="addr-val" id="pageAddr">tanxuii.github.io</span>
        <button class="copy" onclick="copyText('tanxuii.github.io', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
          </svg>复制
        </button>
      </div>
    </div>

    <div class="row">
      <div class="row-label">官网地址<span class="badge">最新版下载</span></div>
      <div class="addr">
        <span class="addr-val" id="siteAddr">mksp1080.top</span>
        <button class="copy" onclick="copyText('mksp1080.top', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
          </svg>复制
        </button>
      </div>
    </div>

    <a class="go" href="https://mksp1080.top" target="_blank" rel="noopener">
      打开官网
      <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
    </a>

    <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在检测…</span></div>
  </div>

  <footer>
    本页为唯一发布入口 · 请勿相信其他来源的安装包<br>
    最后更新 <b>2026-11-18</b>
  </footer>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg>
  <span id="toastText">地址已复制</span>
</div>

<script>
function showToast(msg){
  var t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg||'地址已复制';
  t.classList.add('on');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(function(){t.classList.remove('on');},1900);
}

function copyText(text, btn){
  var done=function(){showToast('地址已复制'); if(btn){var o=btn.innerHTML; btn.innerHTML='已复制'; setTimeout(function(){btn.innerHTML=o;},1400);}};
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(function(){legacy(text,done);});
  }else{legacy(text,done);}
}

function legacy(text,done){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy'); done();}catch(e){showToast('复制失败，请长按地址复制');}
  document.body.removeChild(ta);
}

/* 官网可用性检测（同源外请求，no-cors：能拿到就视为可达） */
(function(){
  var dot=document.getElementById('dot'), txt=document.getElementById('statusText');
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},6000);
  fetch('https://mksp1080.top/?t='+Date.now(),{mode:'no-cors',cache:'no-store',signal:ctrl.signal})
    .then(function(){txt.textContent='服务正常';})
    .catch(function(){dot.classList.add('warn');txt.textContent='当前网络访问不畅，可换网络重试';})
    .finally(function(){clearTimeout(timer);});
})();
</script>
</body>
</html>
